<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX キャラクターBAN確認ツール</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ff4e4e;
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .reset-button {
            background-color: #ff4e4e;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .reset-button:hover { background-color: #e03d3d; }
        .reset-button:active { transform: scale(0.95); }

        /* --- ゲーム画面を再現する2段レイアウト --- */
        .game-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 上段（アサルト、スカーミッシャー） */
        .row-top {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* 下段（リコン、サポート、コントローラー） */
        .row-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* クラスごとの枠 */
        .class-section {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            min-width: 250px;
        }

        /* クラス名（枠の下線） */
        .class-title {
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
            padding-top: 5px;
            text-align: center;
        }
        .assault { border-top: 3px solid #ff4e4e; color: #ff4e4e; }
        .skirmisher { border-top: 3px solid #ffb84d; color: #ffb84d; }
        .recon { border-top: 3px solid #b84dff; color: #b84dff; }
        .support { border-top: 3px solid #4da6ff; color: #4da6ff; }
        .controller { border-top: 3px solid #4dff88; color: #4dff88; }

        /* キャラクターの並び */
        .character-grid {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        /* キャラクターカード（枠） */
        .character-card {
            background-color: #1a1a1a;
            border: 2px solid #3d3d3d;
            width: 55px;  /* ゲーム画面に近い縦長比率に調整 */
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px; /* 文字がはみ出さないよう小さめ */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            overflow: hidden; /* 画像が枠からはみ出ないようにする */
            position: relative;
        }

        /* カード内の画像スタイル */
        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 枠線に合わせて画像を綺麗に収める */
        }

        .character-card:hover {
            border-color: #ffffff;
            z-index: 10;
            transform: scale(1.1);
        }

        /* BAN（灰色）状態 */
        .character-card.banned {
            border-color: #222222 !important;
            filter: grayscale(100%) brightness(30%); /* 画像ごと完全に暗い灰色にします */
        }
    </style>
</head>
<body>

    <h1>APEX LEGENDS BAN/PICK BOARD</h1>
    <button class="reset-button" onclick="resetAllBans()">모든 BAN 해제（RESET）</button>

    <!-- ゲーム画面全体のコンテナ -->
    <div class="game-screen">
        
        <!-- 上段エリア -->
        <div class="row-top">
            <!-- アサルト -->
            <div class="class-section">
                <div class="character-grid">
                    <!-- 画像にする場合は、ここの「マッドマギー」等を <img src="URL"> に書き換えます -->
                    <div class="character-card" onclick="toggleBan(this)">マギー</div>
                    <div class="character-card" onclick="toggleBan(this)">アッシュ</div>
                    <div class="character-card" onclick="toggleBan(this)">ヒューズ</div>
                    <div class="character-card" onclick="toggleBan(this)">バンガ</div>
                    <div class="character-card" onclick="toggleBan(this)">バリス</div>
                </div>
                <div class="class-title assault">▲ アサルト</div>
            </div>

            <!-- スカーミッシャー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)">パス</div>
                    <div class="character-card" onclick="toggleBan(this)">レイス</div>
                    <div class="character-card" onclick="toggleBan(this)">オクタン</div>
                    <div class="character-card" onclick="toggleBan(this)">ホライ</div>
                    <div class="character-card" onclick="toggleBan(this)">ヴァル</div>
                    <div class="character-card" onclick="toggleBan(this)">レヴ</div>
                    <div class="character-card" onclick="toggleBan(this)">オルタ</div>
                </div>
                <div class="class-title skirmisher">▼ スカーミッシャー</div>
            </div>
        </div>

        <!-- 下段エリア -->
        <div class="row-bottom">
            <!-- リコン -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)">ブラハ</div>
                    <div class="character-card" onclick="toggleBan(this)">クリプト</div>
                    <div class="character-card" onclick="toggleBan(this)">シア</div>
                    <div class="character-card" onclick="toggleBan(this)">ヴァンテ</div>
                </div>
                <div class="class-title recon">👁 リコン</div>
            </div>

            <!-- サポート -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)">ジブ</div>
                    <div class="character-card" onclick="toggleBan(this)">ライフ</div>
                    <div class="character-card" onclick="toggleBan(this)">ローバ</div>
                    <div class="character-card" onclick="toggleBan(this)">ニュー</div>
                    <div class="character-card" onclick="toggleBan(this)">コンジ</div>
                </div>
                <div class="class-title support">🛡 サポート</div>
            </div>

            <!-- コントローラー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)">コース</div>
                    <div class="character-card" onclick="toggleBan(this)">ワット</div>
                    <div class="character-card" onclick="toggleBan(this)">ランパ</div>
                    <div class="character-card" onclick="toggleBan(this)">カタ</div>
                </div>
                <div class="class-title controller">☖ コントローラー</div>
            </div>
        </div>

    </div>

    <script>
        function toggleBan(element) {
            element.classList.toggle('banned');
        }

        function resetAllBans() {
            const bannedCards = document.querySelectorAll('.character-card.banned');
            bannedCards.forEach(function(card) {
                card.classList.remove('banned');
            });
        }
    </script>
</body>
</html>
