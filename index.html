<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX キャラクターBAN確認ツール</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ff4e4e;
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* --- BAN数カウンターのスタイル --- */
        .ban-counter {
            font-size: 18px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 15px;
        }

        #counter-number {
            color: #ff4e4e; /* 数字の部分だけ目立つ赤色に */
            font-size: 24px;
            margin: 0 4px;
        }

        .reset-button {
            background-color: #ff4e4e;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .reset-button:hover { background-color: #e03d3d; }
        .reset-button:active { transform: scale(0.95); }

        /* --- ゲーム画面を再現する2段レイアウト --- */
        .game-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 上段（アサルト、スカーミッシャー） */
        .row-top {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* 下段（リコン、サポート、コントローラー） */
        .row-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* クラスごとの枠 */
        .class-section {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            min-width: 250px;
        }

        /* クラス名（枠の下線） */
        .class-title {
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
            padding-top: 5px;
            text-align: center;
        }
        .assault { border-top: 3px solid #ff4e4e; color: #ff4e4e; }
        .skirmisher { border-top: 3px solid #ffb84d; color: #ffb84d; }
        .recon { border-top: 3px solid #b84dff; color: #b84dff; }
        .support { border-top: 3px solid #4da6ff; color: #4da6ff; }
        .controller { border-top: 3px solid #4dff88; color: #4dff88; }

        /* キャラクターの並び */
        .character-grid {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        /* キャラクターカード（枠） */
        .character-card {
            background-color: #1a1a1a;
            border: 2px solid #3d3d3d;
            width: 55px;  /* ゲーム画面に近い縦長比率に調整 */
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px; /* 文字がはみ出さないよう小さめ */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            overflow: hidden; /* 画像が枠からはみ出ないようにする */
            position: relative;
        }

        /* カード内の画像スタイル */
        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 枠線に合わせて画像を綺麗に収める */
        }

        .character-card:hover {
            border-color: #ffffff;
            z-index: 10;
            transform: scale(1.1);
        }

        /* BAN（灰色）状態 */
        .character-card.banned {
            border-color: #222222 !important;
            filter: grayscale(100%) brightness(30%); /* 画像ごと完全に暗い灰色にします */
        }

        /* --- 免責事項フッターのスタイル --- */
        .footer {
            margin-top: 60px;
            padding: 20px 0;
            border-top: 1px solid #222222;
            font-size: 11px;
            color: #666666;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>APEX LEGENDS BAN/PICK BOARD</h1>
    
    <!-- 現在のBAN数表示エリア -->
    <div class="ban-counter">
        現在のBAN数:<span id="counter-number">0</span>人
    </div>

    <button class="reset-button" onclick="resetAllBans()">すべての BAN をリセット（RESET）</button>

    <!-- ゲーム画面全体のコンテナ -->
    <div class="game-screen">
        
        <!-- 上段エリア -->
        <div class="row-top">
            <!-- アサルト -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)"><img src="バンガロール.png" alt="バンガロール"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="レブナント.png" alt="レブナント"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ヒューズ.png" alt="ヒューズ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="マッドマギー.png" alt="マッドマギー"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="バリスティック.png" alt="バリスティック"></div>
                </div>
                <div class="class-title assault">▲ アサルト</div>
            </div>

            <!-- スカーミッシャー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)"><img src="パスファインダー.png" alt="パスファインダー"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="レイス.png" alt="レイス"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="オクタン.png" alt="オクタン"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ホライゾン.png" alt="ホライゾン"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="アッシュ.png" alt="アッシュ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="オルター.png" alt="オルター"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="アクセル.png" alt="アクセル"></div>
                </div>
                <div class="class-title skirmisher">▼ スカーミッシャー</div>
            </div>
        </div>

        <!-- 下段エリア -->
        <div class="row-bottom">
            <!-- リコン -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)"><img src="ブラッドハウンド.png" alt="ブラハ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="クリプト.png" alt="クリプト"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ヴァルキリー.png" alt="ヴァルキリ―"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="シア.png" alt="シア"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ヴァンテージ.png" alt="ヴァンテージ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="スパロー.png" alt="スパロー"></div>
                </div>
                <div class="class-title recon">👁 リコン</div>
            </div>

            <!-- サポート -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)"><img src="ジブラルタル.png" alt="ジブ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ライフライン.png" alt="ライフライン"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ミラージュ.png" alt="ミラージュ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ローバ.png" alt="ローバ"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ニューキャッスル.png" alt="ニューキャッスル"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="コンジット.png" alt="コンジット"></div>
                </div>
                <div class="class-title support">🛡 サポート</div>
            </div>

            <!-- コントローラー -->
            <div class="class-section">
                <div class="character-grid">
                    <div class="character-card" onclick="toggleBan(this)"><img src="コースティック.png" alt="コースティック"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ワットソン.png" alt="ワットソン"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="ランパート.png" alt="ランパート"></div>
                    <div class="character-card" onclick="toggleBan(this)"><img src="カタリスト.png" alt="カタリスト"></div>
                </div>
                <div class="class-title controller">☖ コントローラー</div>
            </div>
        </div>

    </div>

    <!-- 免責事項エリア -->
    <footer class="footer">
        <p>免責事項：本サイトは個人によって作成された非公式のファンサイト（ツール）であり、Electronic Arts社およびRespawn Entertainment社とは一切関係がありません。<br>
        サイト内で使用されているゲーム画像の著作権および商標権は、それぞれの権利所有者に帰属します。</p>
    </footer>

    <script>
        function updateBanCount() {
            const bannedCount = document.querySelectorAll('.character-card.banned').length;
            document.getElementById('counter-number').textContent = bannedCount;
        }

        function toggleBan(element) {
            element.classList.toggle('banned');
            updateBanCount();
        }

        function resetAllBans() {
            const bannedCards = document.querySelectorAll('.character-card.banned');
            bannedCards.forEach(function(card) {
                card.classList.remove('banned');
            });
            updateBanCount();
        }
    </script>
</body>
</html>
